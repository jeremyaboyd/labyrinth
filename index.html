<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LABYRINTH — Crown of the Deep</title>
<!-- user-scalable=no: pinch-zoom on a pad is a misfire, never an intent.
     viewport-fit=cover puts the game under the notch and lets touch.js read
     the safe-area insets back out. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c0906">
<meta name="description" content="An old-school first-person dungeon crawler in the style of early-90s DOS games.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<!-- iOS ignores the manifest: these are how it installs to the home screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Labyrinth">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="frame">
  <canvas id="screen" width="320" height="200"></canvas>
</div>
<!-- engine: no game knowledge -->
<script src="js/engine/util.js"></script>
<script src="js/engine/font.js"></script>
<script src="js/engine/synth.js"></script>
<script src="js/engine/grid.js"></script>
<script src="js/engine/raycaster.js"></script>
<script src="js/engine/input.js"></script>
<!-- game: content, rules, UI -->
<!-- custom-data is a stub until the level designer's export replaces it -->
<script src="custom-data.js"></script>
<script src="js/game/tiles.js"></script>
<script src="js/game/slabs.js"></script>
<script src="js/game/custom.js"></script>
<script src="js/game/config.js"></script>
<script src="js/game/items.js"></script>
<script src="js/game/shops.js"></script>
<script src="js/game/textures.js"></script>
<script src="js/game/sprites.js"></script>
<script src="js/game/sfx.js"></script>
<script src="js/game/dungeon.js"></script>
<script src="js/game/overworld.js"></script>
<script src="js/game/daynight.js"></script>
<script src="js/game/quests.js"></script>
<script src="js/game/save.js"></script>
<script src="js/game/projectiles.js"></script>
<script src="js/game/actors.js"></script>
<script src="js/game/ui.js"></script>
<script src="js/game/menus.js"></script>
<script src="js/game/main.js"></script>
<script src="js/game/touch.js"></script>
<script>
// installable and playable offline. Registered last and guarded, so a browser
// without service workers -- or a file:// open -- just runs the game as before.
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  // ?nosw=1 takes the worker out of the way and clears what it cached. The
  // shell is cached hard, which is right for a game you install and wrong for
  // one you are editing: without this a code change can stay invisible
  // through any number of reloads.
  if (/[?&]nosw=1/.test(location.search)) {
    navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
    if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k)));
  } else {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
}
</script>
</body>
</html>
